<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página de Cadastro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
        }
        .form-container {
            max-width: 800px;
            margin: 50px auto;
            background: #ffffff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>

<div class="container">
    <div class="form-container">
        <h2 class="text-center mb-4">Crie sua Conta</h2>
        
        <form action="#" method="POST">
            <div class="row mb-3">
                <div class="col-md-6">
                    <label for="nomeCompleto" class="form-label">Nome Completo</label>
                    <input type="text" class="form-control" id="nomeCompleto" placeholder="Digite seu nome completo" required>
                </div>
                <div class="col-md-6">
                    <label for="nomeUsuario" class="form-label">Nome de Usuário (Apelido)</label>
                    <div class="input-group">
                        <span class="input-group-text">@</span>
                        <input type="text" class="form-control" id="nomeUsuario" placeholder="Seu apelido" required>
                    </div>
                </div>
            </div>

            <div class="row mb-3">
                <div class="col-md-6">
                    <label for="email" class="form-label">E-mail</label>
                    <input type="email" class="form-control" id="email" placeholder="exemplo@email.com" required>
                </div>
                <div class="col-md-6">
                    <label for="telefone" class="form-label">Número de Telefone</label>
                    <input type="tel" class="form-control" id="telefone" placeholder="(00) 00000-0000" required>
                </div>
            </div>

            <div class="row mb-3">
                <div class="col-md-6">
                    <label for="senha" class="form-label">Senha</label>
                    <input type="password" class="form-control" id="senha" placeholder="Crie uma senha forte" required>
                </div>
                <div class="col-md-6">
                    <label for="confirmaSenha" class="form-label">Confirmação de Senha</label>
                    <input type="password" class="form-control" id="confirmaSenha" placeholder="Repita a senha" required>
                </div>
            </div>

            <hr class="my-4">
            <h5 class="mb-3">Endereço</h5>

            <div class="row mb-3">
                <div class="col-md-4">
                    <label for="pais" class="form-label">País</label>
                    <select class="form-select" id="pais" required>
                        <option value="" selected disabled>Selecione...</option>
                        <option value="br">Brasil</option>
                        <option value="pt">Portugal</option>
                        <option value="us">Estados Unidos</option>
                        </select>
                </div>
                <div class="col-md-4">
                    <label for="estado" class="form-label">Estado</label>
                    <input type="text" class="form-control" id="estado" placeholder="Ex: São Paulo" required>
                </div>
                <div class="col-md-4">
                    <label for="cidade" class="form-label">Cidade</label>
                    <input type="text" class="form-control" id="cidade" placeholder="Ex: Campinas" required>
                </div>
            </div>

            <div class="row mb-4">
                <div class="col-md-4">
                    <label for="cep" class="form-label">CEP</label>
                    <input type="text" class="form-control" id="cep" placeholder="00000-000" required>
                </div>
            </div>

            <div class="d-grid gap-2">
                <button type="submit" class="btn btn-primary btn-lg">Cadastrar</button>
            </div>
            
            <div class="text-center mt-3">
                <p>Já tem uma conta? <a href="login.html" class="text-decoration-none">Faça login aqui</a>.</p>
            </div>
        </form>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
